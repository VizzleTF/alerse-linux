# One stage of the Linux build, in ungoogled-chromium-portablelinux' build
# container: the first prepares the source tree, later ones build until the
# time runs out and hand the tree to the next one as an artifact.
# Adapted from ungoogled-chromium-portablelinux (BSD-3-Clause).
name: Stage
description: Run one stage of the Alerse Linux build

inputs:
  prepare-only:
    description: "'true' to only download, patch and configure the source tree"
    required: false
    default: "false"
  final:
    description: "'true' for the last stage, which fails if the build is not done"
    required: false
    default: "false"

outputs:
  status:
    description: "'running' while the build is not done, 'completed' when it is"
    value: ${{ steps.build.outputs.status }}

runs:
  using: composite
  steps:
    - name: Assemble the upstream build
      shell: bash
      run: bash assemble.sh

    - name: Download the build container
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-image-${{ env.ARCH }}
        path: /tmp

    - name: Load the build container
      shell: bash
      run: docker load -i /tmp/chromium-builder.tar && rm /tmp/chromium-builder.tar

    - name: Download the build tree
      if: ${{ inputs.prepare-only != 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-cache-${{ env.ARCH }}
        path: ungoogled-chromium-portablelinux/.github/cache/

    - name: Unpack the build tree
      if: ${{ inputs.prepare-only != 'true' }}
      shell: bash
      working-directory: ungoogled-chromium-portablelinux
      run: bash ./.github/scripts/import-cache.sh

    - name: Build
      id: build
      shell: bash
      working-directory: ungoogled-chromium-portablelinux
      env:
        _prepare_only: ${{ inputs.prepare-only }}
        _use_existing_image: "true"
        _gha_final: ${{ inputs.final }}
      run: bash ./scripts/docker-build.sh

    # x86_64 releases are built with PGO, or not at all (assemble.sh).
    - name: Check PGO
      if: ${{ inputs.prepare-only == 'true' && env.ARCH == 'x86_64' }}
      shell: bash
      working-directory: ungoogled-chromium-portablelinux/build/src
      run: |
        phase="$(sed -n 's/^[[:space:]]*chrome_pgo_phase[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' out/Default/args.gn | tail -1)"
        profile="chrome/build/pgo_profiles/$(tr -d '[:space:]' < chrome/build/linux.pgo.txt)"
        echo "chrome_pgo_phase=$phase, profile $profile"
        [ "$phase" = 2 ] || { echo "::error::args.gn does not end with chrome_pgo_phase=2."; exit 1; }
        [ -s "$profile" ] || { echo "::error::The PGO profile $profile is missing."; exit 1; }

    - name: Pack the build tree
      shell: bash
      working-directory: ungoogled-chromium-portablelinux
      run: bash ./.github/scripts/export-cache.sh

    - name: Upload the build tree
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-cache-${{ env.ARCH }}
        path: ungoogled-chromium-portablelinux/.github/cache/build-cache-${{ env.ARCH }}.tar.zst
        if-no-files-found: error
        overwrite: true
        retention-days: 2
