# Builds Arcomium for Linux (x86_64 and arm64). A tag `v*` also publishes a
# GitHub Release with the AppImages and tar.xz archives; a manual run only
# builds, and its packages are kept as workflow artifacts for 4 days.
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  x86_64:
    uses: ./.github/workflows/build.yml
    with:
      arch: x86_64

  arm64:
    uses: ./.github/workflows/build.yml
    with:
      arch: arm64

  publish:
    needs: [x86_64, arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }

      - name: Chromium version
        id: chromium
        run: |
          echo "version=$(cat ungoogled-chromium-portablelinux/ungoogled-chromium/chromium_version.txt)" >> "$GITHUB_OUTPUT"
          echo "arcomium=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Checksums
        run: |
          cd packages
          ls -l
          sha256sum Arcomium-* > SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Arcomium ${{ steps.chromium.outputs.arcomium }} for Linux
          body: |
            Arcomium ${{ steps.chromium.outputs.arcomium }} for Linux, Chromium ${{ steps.chromium.outputs.version }} (ungoogled-chromium).
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            packages/Arcomium-*
            packages/SHA256SUMS
