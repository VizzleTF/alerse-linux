# Builds Arcomium for Linux (x86_64 and arm64). A tag `v*` also publishes a
# GitHub Release with the AppImages and tar.xz archives; a manual run only
# builds, and its packages are kept as workflow artifacts for 4 days.
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  x86_64:
    uses: ./.github/workflows/build.yml
    with:
      arch: x86_64

  arm64:
    uses: ./.github/workflows/build.yml
    with:
      arch: arm64

  publish:
    needs: [x86_64, arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Checksums
        run: |
          cd packages
          ls -l
          sha256sum Arcomium-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            packages/Arcomium-*
            packages/SHA256SUMS
