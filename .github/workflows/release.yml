# Builds Alerse for Linux (x86_64 and arm64). A tag vMAJOR.MINOR.PATCH also
# publishes a GitHub Release: each architecture's AppImage and tar.xz are added
# as soon as that architecture is built, so x86_64 does not wait for arm64, and
# one that fails does not hold back the other. A manual run only builds, and
# its packages are kept as workflow artifacts for 4 days.
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Checks the tag against alerse/VERSION and the latest release before a
  # day of building.
  version:
    runs-on: ubuntu-latest
    outputs:
      alerse: ${{ steps.version.outputs.alerse }}
      chromium: ${{ steps.version.outputs.chromium }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/release-version.sh ungoogled-chromium-portablelinux/ungoogled-chromium/chromium_version.txt

  x86_64:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      arch: x86_64

  arm64:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      arch: arm64

  publish-x86_64:
    needs: [version, x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      arch: x86_64
      alerse: ${{ needs.version.outputs.alerse }}
      chromium: ${{ needs.version.outputs.chromium }}

  publish-arm64:
    needs: [version, arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      arch: arm64
      alerse: ${{ needs.version.outputs.alerse }}
      chromium: ${{ needs.version.outputs.chromium }}
